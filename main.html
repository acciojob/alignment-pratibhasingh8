<!DOCTYPE html>

<html>

<head>
    <title>HTML Assignment 3</title>

    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        td {
            border: 1px solid black;
            height: 20px;
            padding: 2px;
        }

        .table1 {
            margin-bottom: 20px;
        }

        .table2 {
            margin-bottom: 20px;
        }

        .table3 img {
            width: 140px;
            height: 100px;
            object-fit: cover;
            display: block;
            margin: auto;
        }

        .image-cell {
            text-align: center;
        }

        .green {
            background-color: green;
            height: 12px;
        }

        .blue {
            background-color: blue;
            height: 12px;
        }
    </style>
</head>

<body>

    <h3>HTML Assignment #3</h3>

    <!-- First Table -->
    <table class="table1">
        <tr>
            <td>left</td>
            <td>center</td>
            <td>right</td>
        </tr>
        <tr>
            <td>left</td>
            <td>center</td>
            <td>right</td>
        </tr>
        <tr>
            <td>left</td>
            <td>center</td>
            <td>right</td>
        </tr>
    </table>

    <!-- Second Table -->
    <table class="table2">
        <tr>
            <td colspan="6"></td>
        </tr>
        <tr>
            <td rowspan="4"></td>
            <td colspan="2"></td>
            <td></td>
            <td></td>
            <td></td>
        </tr>
        <tr>
            <td></td>
            <td colspan="3"></td>
            <td></td>
        </tr>
        <tr>
            <td colspan="2"></td>
            <td colspan="2"></td>
            <td></td>
        </tr>
        <tr>
            <td colspan="4"></td>
            <td></td>
        </tr>
    </table>

    <!-- Third Table -->
    <table class="table3">
        <tr>
            <td colspan="3" class="green"></td>
        </tr>
        <tr>
            <td></td>
            <td class="image-cell">
                <img
                    src="https://picsum.photos/id/123/200/100"
                    alt="Sample image"
                >
            </td>
            <td></td>
        </tr>
        <tr>
            <td colspan="3" class="blue"></td>
        </tr>
    </table>

</body>
</html>
